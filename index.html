<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Idea Lab</title>
  <meta name="description" content="Bobby's prototypes and live sites, ranked.">
  <meta name="theme-color" content="#0d0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Idea Lab">
  <link rel="manifest" href="./launcher.webmanifest">
  <link rel="icon" type="image/png" href="./launcher-icon-192.png">
  <link rel="apple-touch-icon" href="./launcher-icon-180.png">
  <style>
    :root {
      --bg: #0d0d12;
      --fg: #f5f5f7;
      --muted: rgba(245, 245, 247, 0.58);
      --faint: rgba(245, 245, 247, 0.35);
      --card: rgba(255, 255, 255, 0.065);
      --card-hi: rgba(255, 255, 255, 0.11);
      --line: rgba(255, 255, 255, 0.09);
      --accent: #ff7a45;
      --gold: #ffcc4d;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(120% 60% at 15% 0%, #3a2a6b 0%, transparent 60%),
        radial-gradient(90% 50% at 100% 30%, #0e4d5c 0%, transparent 60%),
        radial-gradient(100% 60% at 50% 110%, #5b2240 0%, transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--fg);
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      padding: calc(env(safe-area-inset-top) + 24px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(16px, env(safe-area-inset-left));
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 1180px; margin: 0 auto; }
    header { margin: 4px 4px 18px; }
    h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0; font-weight: 700; }
    header p { margin: 4px 0 0; color: var(--muted); }

    .chips { display: flex; gap: 8px; margin: 0 2px 18px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; border: 1px solid var(--line); background: var(--card); color: var(--fg);
      font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer;
    }
    .chip span { color: var(--muted); font-weight: 500; margin-left: 4px; }
    .chip[aria-pressed="true"] { background: var(--fg); color: #111; border-color: var(--fg); }
    .chip[aria-pressed="true"] span { color: rgba(0,0,0,0.5); }

    #list { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 760px) { #list { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1120px) { #list { grid-template-columns: repeat(3, 1fr); } }

    .card {
      position: relative;
      display: grid; grid-template-columns: 112px 1fr 40px; gap: 14px;
      padding: 12px; border-radius: 22px;
      background: var(--card); border: 1px solid var(--line);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      transition: background 0.2s, box-shadow 0.2s, transform 0.25s cubic-bezier(.2,.8,.2,1);
      will-change: transform;
    }
    .card[hidden] { display: none; }
    .card.dragging { transition: background 0.2s, box-shadow 0.2s; background: var(--card-hi); box-shadow: 0 18px 40px rgba(0,0,0,0.5); z-index: 5; }
    .card.top1 { border-color: rgba(255, 204, 77, 0.45); }

    .shot {
      position: relative; display: block; width: 112px; aspect-ratio: 390 / 844;
      border-radius: 16px; overflow: hidden; background: var(--c, #333);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 8px 20px rgba(0,0,0,0.35);
    }
    .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .shot .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; font-weight: 800; color: rgba(255,255,255,0.85); }

    .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
    .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .rank {
      font: inherit; font-size: 13px; font-weight: 800; letter-spacing: 0.02em;
      color: #111; background: var(--fg); border: 0; border-radius: 999px; padding: 3px 9px; cursor: pointer;
    }
    .top1 .rank { background: var(--gold); }
    .pill { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .pill.new { color: var(--accent); }
    .pill.warn { color: #ff6b5e; }
    h3 { margin: 2px 0 0; font-size: 19px; line-height: 1.2; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
    h3 img { width: 26px; height: 26px; border-radius: 7px; flex: none; }
    h3 span { overflow: hidden; text-overflow: ellipsis; }
    .desc { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .when { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .open {
      margin-top: auto; align-self: flex-start;
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.12); color: var(--fg); text-decoration: none;
      font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    }
    .open:active { background: rgba(255,255,255,0.2); }

    .mover { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .mover button {
      width: 38px; height: 38px; border-radius: 12px; border: 0; background: transparent;
      color: var(--muted); font-size: 18px; cursor: pointer; display: grid; place-items: center;
    }
    .mover button:active { background: rgba(255,255,255,0.1); color: var(--fg); }
    .mover button:disabled { opacity: 0.2; }
    .handle { touch-action: none; cursor: grab; height: 64px !important; }
    .handle svg { width: 18px; height: 18px; }
    .dragging .handle { cursor: grabbing; color: var(--fg); }

    .tip { margin: 26px 6px 0; color: var(--faint); font-size: 13px; text-align: center; }
    #saved {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 20px);
      background: rgba(30, 30, 36, 0.92); color: var(--fg); border: 1px solid var(--line);
      padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100% - 32px); text-align: center;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 20;
    }
    #saved.show { opacity: 1; transform: translate(-50%, 0); }
    #saved.bad { background: #5a1d1d; border-radius: 16px; }
    .tip button { font: inherit; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
  </style>
</head>

    const ITEMS = [{"id":"app:translator","kind":"prototype","name":"Girl Math","title":"Girl Math: save for your wishlist","description":"A savings jar for the things you want, powered by girl math.","url":"./translator/","icon":"./translator/icons/apple-touch-icon.png","color":"#FFF0F6","shot":"./shots/translator.jpg?v=2026-10-20T17%3A32%3A16.537Z","updatedAt":"2026-10-20T17:32:01.716Z","addedAt":"2026-10-20T17:32:01.716Z","broken":false},{"id":"app:two-words","kind":"prototype","name":"Two Words","title":"Two Words","description":"Two unrelated words to spark a new idea. Save the good ones.","url":"./two-words/","icon":"./two-words/apple-touch-icon.png","color":"#ffffff","shot":"./shots/two-words.jpg?v=2026-10-20T17%3A26%3A07.109Z","updatedAt":"2026-10-20T17:25:50.649Z","addedAt":"2026-10-20T17:25:50.649Z","broken":false},{"id":"app:scrappy","kind":"prototype","name":"Scrappy","title":"Scrappy","description":"Your camera roll, bound into a book.","url":"./scrappy/","icon":"./scrappy/apple-touch-icon.png","color":"#0B0B0C","shot":"./shots/scrappy.jpg?v=2026-10-20T17%3A21%3A33.098Z","updatedAt":"2026-10-20T17:21:11.093Z","addedAt":"2026-10-20T17:21:11.093Z","broken":false},{"id":"app:tiny-kitten-war","kind":"prototype","name":"Kitten War","title":"Tiny Kitten War","description":"A very big war. A very small cat.","url":"./tiny-kitten-war/","icon":"./tiny-kitten-war/apple-touch-icon.png","color":"#2b1d3a","shot":"./shots/tiny-kitten-war.jpg?v=2026-10-20T17%3A05%3A54.334Z","updatedAt":"2026-10-19T01:37:21.924Z","addedAt":"2026-10-19T01:37:21.924Z","broken":false},{"id":"app:unlock-gate","kind":"prototype","name":"Gate","title":"Unlock Gate","description":"Earn your scroll. Hold a plank, read a page or say a prayer before your social apps open.","url":"./unlock-gate/","icon":"./unlock-gate/apple-touch-icon.png","color":"#f5efe3","shot":"./shots/unlock-gate.jpg?v=2026-10-20T17%3A05%3A50.831Z","updatedAt":"2026-10-19T01:18:16.626Z","addedAt":"2026-10-19T01:18:16.626Z","broken":false},{"id":"app:decision-journal","kind":"prototype","name":"Hindsight","title":"Hindsight: Decision Journal","description":"Log decisions as you make them. Hindsight checks back at 30, 60 and 90 days and tells you how often your gut is right.","url":"./decision-journal/","icon":"./decision-journal/apple-touch-icon.png","color":"#f5f0e6","shot":"./shots/decision-journal.jpg?v=2026-10-20T17%3A05%3A47.529Z","updatedAt":"2026-10-19T01:16:04.362Z","addedAt":"2026-10-19T01:16:04.362Z","broken":false},{"id":"app:colony","kind":"prototype","name":"Colony","title":"Colony","description":"Start with one anthill. End with the world.","url":"./colony/","icon":"./colony/apple-touch-icon.png","color":"#1a110a","shot":"./shots/colony.jpg?v=2026-10-20T17%3A05%3A44.127Z","updatedAt":"2026-10-19T00:57:21.747Z","addedAt":"2026-10-19T00:57:21.747Z","broken":false},{"id":"app:slow-reveal","kind":"prototype","name":"Slow Reveal","title":"Slow Reveal","description":"Send a gift that unwraps a little more every day until the big reveal.","url":"./slow-reveal/","icon":"./slow-reveal/apple-touch-icon.png","color":"#fbf3e8","shot":"./shots/slow-reveal.jpg?v=2026-10-20T17%3A05%3A40.333Z","updatedAt":"2026-10-19T00:42:58.273Z","addedAt":"2026-10-19T00:42:58.273Z","broken":false},{"id":"app:tiny-lungs","kind":"prototype","name":"Tiny Lungs","title":"Tiny Lungs","description":"Quit vaping for someone small.","url":"./tiny-lungs/","icon":"./tiny-lungs/apple-touch-icon.png","color":"#DDF4EC","shot":"./shots/tiny-lungs.jpg?v=2026-10-20T17%3A05%3A36.648Z","updatedAt":"2026-10-19T00:02:11.849Z","addedAt":"2026-10-19T00:02:11.849Z","broken":false},{"id":"app:tapes","kind":"prototype","name":"Tapes","title":"Tapes","description":"A voice journal where every recording becomes a cassette on your shelf.","url":"./tapes/","icon":"./tapes/apple-touch-icon.png","color":"#F3EADB","shot":"./shots/tapes.jpg?v=2026-10-20T17%3A05%3A25.896Z","updatedAt":"2026-10-18T23:59:27.633Z","addedAt":"2026-10-18T23:59:27.633Z","broken":false},{"id":"app:pocket-pet","kind":"prototype","name":"Pocket Pet","title":"Pocket Pet","description":"Turn your real pet into a tiny buddy you can feed, pet and dress up.","url":"./pocket-pet/","icon":"./pocket-pet/icons/apple-touch-icon.png","color":"#fff6ec","shot":"./shots/pocket-pet.jpg?v=2026-10-20T17%3A05%3A32.947Z","updatedAt":"2026-10-18T23:59:23.476Z","addedAt":"2026-10-18T23:59:23.476Z","broken":false},{"id":"app:color-walk","kind":"prototype","name":"Color Walk","title":"Color Walk","description":"A relaxed daily walk. A new color every day.","url":"./color-walk/","icon":"./color-walk/icons/apple-touch-icon.png","color":"#F7F3EC","shot":"./shots/color-walk.jpg?v=2026-10-20T17%3A05%3A11.754Z","updatedAt":"2026-10-18T23:58:40.536Z","addedAt":"2026-10-18T23:58:40.536Z","broken":false},{"id":"app:wrapped-for-two","kind":"prototype","name":"Two of Us","title":"Two of Us","description":"A Wrapped-style story about you and your person.","url":"./wrapped-for-two/","icon":"./wrapped-for-two/icon-180.png","color":"#0E0C14","shot":"./shots/wrapped-for-two.jpg?v=2026-10-20T17%3A05%3A29.433Z","updatedAt":"2026-10-18T23:57:21.636Z","addedAt":"2026-10-18T23:57:21.636Z","broken":false},{"id":"app:read-the-texts","kind":"prototype","name":"Read","title":"Read the Texts","description":"Screenshot the chat. Find out if they're into you.","url":"./read-the-texts/","icon":"./read-the-texts/apple-touch-icon.png","color":"#0d0a12","shot":"./shots/read-the-texts.jpg?v=2026-10-20T17%3A05%3A18.964Z","updatedAt":"2026-10-18T23:56:43.107Z","addedAt":"2026-10-18T23:56:43.107Z","broken":false},{"id":"app:step-breaker","kind":"prototype","name":"Pip","title":"Pip: tiny steps","description":"Pip turns scary tasks into tiny, doable steps.","url":"./step-breaker/","icon":"./step-breaker/icons/apple-touch-icon.png","color":"#FFF6EC","shot":"./shots/step-breaker.jpg?v=2026-10-20T17%3A05%3A15.170Z","updatedAt":"2026-10-18T23:56:41.621Z","addedAt":"2026-10-18T23:56:41.621Z","broken":false},{"id":"site:riffraff","kind":"site","name":"RiffRaff","title":"RiffRaff: Party Games","description":"Phone-only party games. No TV, no console, just everyone's phones.","url":"https://bobby-coleman.github.io/jacked-box/","icon":null,"color":"#ff5a36","shot":"./shots/site-riffraff.jpg?v=2026-10-27T00%3A54%3A53.119Z","host":"bobby-coleman.github.io/jacked-box"},{"id":"site:ethos","kind":"site","name":"Ethos","title":"Ethos","description":"Personal LifeOS dashboard: durable capture and a governed memory, behind an invite-only sign-in.","url":"https://ethos.sarl/","icon":null,"color":"#2b2b33","shot":"./shots/site-ethos.jpg?v=2026-10-27T00%3A54%3A58.990Z","host":"ethos.sarl"},{"id":"site:jimothy-simulator","kind":"site","name":"Jimothy","title":"Jimothy Simulator","description":"Goat Simulator-style physics sandbox starring Jimothy, the round raccoon of Ballard.","url":"https://bobby-coleman.github.io/jimothy-simulator/","icon":null,"color":"#5c8d3a","shot":"./shots/site-jimothy-simulator.jpg?v=2026-10-27T00%3A55%3A29.105Z","host":"bobby-coleman.github.io/jimothy-simulator"},{"id":"site:the-chamber","kind":"site","name":"The Chamber","title":"The Chamber","description":"A level-based WebGPU survival game.","url":"https://bobby-coleman.github.io/the-chamber-1/","icon":null,"color":"#3a2f52","shot":"./shots/site-the-chamber.jpg?v=2026-10-27T00%3A55%3A34.210Z","host":"bobby-coleman.github.io/the-chamber-1"},{"id":"site:whisker","kind":"site","name":"Whisker","title":"Whisker","description":"Live from the WHISKER repo.","url":"https://bobby-coleman.github.io/WHISKER/","icon":null,"color":"#c27b3e","shot":"./shots/site-whisker.jpg?v=2026-10-27T00%3A55%3A45.342Z","host":"bobby-coleman.github.io/WHISKER"},{"id":"site:play-me","kind":"site","name":"Play Me","title":"Play Me","description":"Built with Rork, live on Vercel.","url":"https://rork-play-me.vercel.app/","icon":null,"color":"#7b5cff","shot":"./shots/site-play-me.jpg?v=2026-10-27T00%3A55%3A50.815Z","host":"rork-play-me.vercel.app"},{"id":"site:cursed-depths","kind":"site","name":"Cursed Depths","title":"Cursed Depths","description":"A roguelike dungeon crawler with curses.","url":"https://bobby-coleman.github.io/CURSED-DEPTHS-3-DESKTOP/","icon":null,"color":"#7a1f2b","shot":"./shots/site-cursed-depths.jpg?v=2026-10-27T00%3A55%3A57.202Z","host":"bobby-coleman.github.io/CURSED-DEPTHS-3-DESKTOP"}]
    const KEY = 'idealab.rank.v1'
    const FILTER_KEY = 'idealab.filter.v1'
    const store = {
      get(k) { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true } catch { return false } },
      del(k) { try { localStorage.removeItem(k) } catch {} },
    }

    // The ranking is kept in three places (localStorage, a long-lived cookie and
    // IndexedDB), each stamped with when it was saved; the newest copy wins. iOS
    // can drop one of them (storage pressure, settings, in-app browsers) without
    // touching the others.
    const rank = {
      cookie: 'idealab_rank',
      read() {
        const copies = [store.get(KEY)]
        try {
          const m = document.cookie.match(new RegExp('(?:^|; )' + this.cookie + '=([^;]*)'))
          if (m) copies.push(JSON.parse(decodeURIComponent(m[1])))
        } catch {}
        return newest(copies)
      },
      write(order) {
        const rec = { at: Date.now(), order }
        let ok = store.set(KEY, rec)
        try {
          document.cookie = `${this.cookie}=${encodeURIComponent(JSON.stringify(rec))}; max-age=34560000; path=/; SameSite=Lax; Secure`
          ok = ok || document.cookie.includes(this.cookie + '=')
        } catch {}
        idb.put(rec).then((stored) => { if (stored && !ok) showSaved(true) })
        return ok
      },
      clear() {
        store.del(KEY)
        try { document.cookie = `${this.cookie}=; max-age=0; path=/` } catch {}
        idb.put({ at: Date.now(), order: [] })
      },
    }
    // Older versions saved a bare array of ids.
    function newest(copies) {
      return copies
        .map((c) => Array.isArray(c) ? { at: 0, order: c } : c)
        .filter((c) => c && Array.isArray(c.order))
        .sort((a, b) => b.at - a.at)[0] || null
    }
    const idb = {
      open() {
        return new Promise((resolve) => {
          try {
            const req = indexedDB.open('idealab', 1)
            req.onupgradeneeded = () => req.result.createObjectStore('kv')
            req.onsuccess = () => resolve(req.result)
            req.onerror = () => resolve(null)
          } catch { resolve(null) }
        })
      },
      async get() {
        const db = await this.open()
        if (!db) return null
        return new Promise((resolve) => {
          try {
            const req = db.transaction('kv').objectStore('kv').get('rank')
            req.onsuccess = () => resolve(req.result || null)
            req.onerror = () => resolve(null)
          } catch { resolve(null) }
        })
      },
      async put(rec) {
        const db = await this.open()
        if (!db) return false
        return new Promise((resolve) => {
          try {
            const tx = db.transaction('kv', 'readwrite')
            tx.objectStore('kv').put(rec, 'rank')
            tx.oncomplete = () => resolve(true)
            tx.onerror = () => resolve(false)
          } catch { resolve(false) }
        })
      },
    }
    try { navigator.storage?.persist?.() } catch {}

    const byId = new Map(ITEMS.map((it) => [it.id, it]))
    const list = document.getElementById('list')
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' })
    const ago = (iso) => {
      const s = (new Date(iso) - Date.now()) / 1000
      if (!isFinite(s)) return ''
      const [v, u] = Math.abs(s) < 3600 ? [s / 60, 'minute'] : Math.abs(s) < 86400 ? [s / 3600, 'hour'] : [s / 86400, 'day']
      return rtf.format(Math.round(v), u)
    }

    let current = rank.read()
    function savedOrder() {
      const saved = (current?.order || []).filter((id) => byId.has(id))
      const rest = ITEMS.map((it) => it.id).filter((id) => !saved.includes(id))
      return [...saved, ...rest]
    }

    function card(it) {
      const isNew = it.kind === 'prototype' && it.addedAt && Date.now() - new Date(it.addedAt) < 86400e3
      const el = document.createElement('article')
      el.className = 'card'
      el.dataset.id = it.id
      el.dataset.kind = it.kind
      const target = it.kind === 'site' ? ' target="_blank" rel="noopener"' : ''
      el.innerHTML = `
        <a class="shot" href="${esc(it.url)}"${target} style="--c:${esc(it.color)}" aria-label="Open ${esc(it.title)}">
          ${it.shot ? `<img src="${esc(it.shot)}" alt="" loading="lazy" decoding="async">` : `<span class="ph">${esc((it.name || '?').slice(0, 1))}</span>`}
        </a>
        <div class="body">
          <div class="row1">
            <button class="rank" type="button" aria-label="Change rank"></button>
            <span class="pill">${it.kind === 'site' ? 'Live site' : 'Prototype'}</span>
            ${isNew ? '<span class="pill new">New</span>' : ''}
            ${it.broken ? '<span class="pill warn">Latest build failed</span>' : ''}
          </div>
          <h3>${it.icon ? `<img src="${esc(it.icon)}" alt="" loading="lazy">` : ''}<span>${esc(it.title)}</span></h3>
          <p class="desc">${esc(it.description)}</p>
          <div class="when">${it.kind === 'site' ? esc(it.host) : `Updated ${esc(ago(it.updatedAt))}`}</div>
          <a class="open" href="${esc(it.url)}"${target}>Open ${it.kind === 'site' ? '↗' : '›'}</a>
        </div>
        <div class="mover">
          <button class="up" type="button" aria-label="Move up">▲</button>
          <button class="handle" type="button" aria-label="Drag to rank"><svg viewBox="0 0 18 18" fill="currentColor"><circle cx="6" cy="3" r="1.6"/><circle cx="12" cy="3" r="1.6"/><circle cx="6" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="6" cy="15" r="1.6"/><circle cx="12" cy="15" r="1.6"/></svg></button>
          <button class="down" type="button" aria-label="Move down">▼</button>
        </div>`
      return el
    }

    const cards = () => [...list.children]
    const visible = () => cards().filter((c) => !c.hidden)

    function refresh() {
      const all = cards()
      all.forEach((c, i) => {
        c.querySelector('.rank').textContent = `#${i + 1}`
        c.classList.toggle('top1', i === 0)
      })
      const vis = visible()
      vis.forEach((c, i) => {
        c.querySelector('.up').disabled = i === 0
        c.querySelector('.down').disabled = i === vis.length - 1
      })
    }
    function save() {
      const order = cards().map((c) => c.dataset.id)
      current = { at: Date.now(), order }
      showSaved(rank.write(order))
      refresh()
    }
    let savedTimer = 0
    function showSaved(ok) {
      const el = document.getElementById('saved')
      el.textContent = ok ? 'Ranking saved' : "This browser won't let the page save. Open it in Safari or from your Home Screen."
      el.className = ok ? 'show' : 'show bad'
      clearTimeout(savedTimer)
      if (ok) savedTimer = setTimeout(() => { el.className = '' }, 1600)
    }

    // Animate cards from their old positions to the new ones.
    function flip(mutate) {
      const before = new Map(cards().map((c) => [c, c.getBoundingClientRect().top]))
      // Grid layouts also shift sideways; only vertical motion is animated.
      mutate()
      for (const c of cards()) {
        if (c.classList.contains('dragging')) continue
        const dy = before.get(c) - c.getBoundingClientRect().top
        if (!dy) continue
        c.dataset.movedAt = Date.now()
        c.style.transition = 'none'
        c.style.transform = `translateY(${dy}px)`
        requestAnimationFrame(() => { c.style.transition = ''; c.style.transform = '' })
      }
    }

    function move(c, dir) {
      const vis = visible()
      const i = vis.indexOf(c)
      const other = vis[i + dir]
      if (!other) return
      flip(() => dir < 0 ? other.before(c) : other.after(c))
      save()
    }

    // Drag by the handle. The card follows the finger and takes the place of
    // whichever card it's over. Near the screen edges the page scrolls, so a
    // long list can be ranked in one drag.
    let drag = null
    function follow() {
      const { c, x, y, offX, offY } = drag
      c.style.transform = ''
      const r = c.getBoundingClientRect()
      c.style.transform = `translate(${x - offX - r.left}px, ${y - offY - r.top}px)`
    }
    function reorder() {
      const { c, x, y } = drag
      const over = document.elementFromPoint(x, y)?.closest('.card')
      if (!over || over === c || over.hidden || Date.now() - (over.dataset.movedAt || 0) < 260) return
      const all = cards()
      flip(() => all.indexOf(over) < all.indexOf(c) ? over.before(c) : over.after(c))
      refresh()
    }
    function tick() {
      if (!drag) return
      const edge = 90, h = window.innerHeight
      const v = drag.y < edge ? -Math.ceil((edge - drag.y) / 5) : drag.y > h - edge ? Math.ceil((drag.y - (h - edge)) / 5) : 0
      if (v) { window.scrollBy(0, v); reorder(); follow() }
      drag.raf = requestAnimationFrame(tick)
    }
    list.addEventListener('pointerdown', (e) => {
      const handle = e.target.closest('.handle')
      if (!handle) return
      e.preventDefault()
      const c = handle.closest('.card')
      const r = c.getBoundingClientRect()
      drag = { c, x: e.clientX, y: e.clientY, offX: e.clientX - r.left, offY: e.clientY - r.top, raf: 0 }
      c.classList.add('dragging')
      c.style.pointerEvents = 'none'
      tick()
    })
    window.addEventListener('pointermove', (e) => {
      if (!drag) return
      drag.x = e.clientX
      drag.y = e.clientY
      reorder()
      follow()
    })
    function endDrag() {
      if (!drag) return
      cancelAnimationFrame(drag.raf)
      const { c } = drag
      drag = null
      c.classList.remove('dragging')
      c.style.pointerEvents = ''
      c.style.transform = ''
      save()
    }
    window.addEventListener('pointerup', endDrag)
    window.addEventListener('pointercancel', endDrag)

    list.addEventListener('click', (e) => {
      const c = e.target.closest('.card')
      if (!c) return
      if (e.target.closest('.up')) move(c, -1)
      else if (e.target.closest('.down')) move(c, 1)
      else if (e.target.closest('.rank')) {
        const all = cards()
        const answer = prompt(`Move "${byId.get(c.dataset.id).title}" to rank (1 to ${all.length}):`, String(all.indexOf(c) + 1))
        const n = parseInt(answer, 10)
        if (!n || n < 1) return
        const target = all[Math.min(n, all.length) - 1]
        if (target === c) return
        flip(() => all.indexOf(target) < all.indexOf(c) ? target.before(c) : target.after(c))
        save()
      }
    })

    // Filters
    const filters = [
      ['all', 'All', ITEMS.length],
      ['prototype', 'Prototypes', ITEMS.filter((i) => i.kind === 'prototype').length],
      ['site', 'Live sites', ITEMS.filter((i) => i.kind === 'site').length],
    ]
    const chips = document.getElementById('chips')
    let filter = store.get(FILTER_KEY) || 'all'
    chips.innerHTML = filters.map(([k, label, n]) => `<button class="chip" type="button" data-f="${k}">${label}<span>${n}</span></button>`).join('')
    function applyFilter() {
      for (const b of chips.children) b.setAttribute('aria-pressed', String(b.dataset.f === filter))
      for (const c of cards()) c.hidden = filter !== 'all' && c.dataset.kind !== filter
      refresh()
    }
    chips.addEventListener('click', (e) => {
      const b = e.target.closest('.chip')
      if (!b) return
      filter = b.dataset.f
      store.set(FILTER_KEY, filter)
      applyFilter()
    })

    document.getElementById('reset').addEventListener('click', () => {
      if (!confirm('Reset your ranking to the default order?')) return
      rank.clear()
      current = null
      render()
    })

    function render() {
      list.replaceChildren(...savedOrder().map((id) => card(byId.get(id))))
      const n = ITEMS.filter((i) => i.kind === 'prototype').length
      const s = ITEMS.length - n
      document.getElementById('sub').textContent = `${n} prototypes and ${s} live sites, ranked your way.`
      applyFilter()
    }
    render()

    // IndexedDB answers asynchronously; if it holds a newer ranking, use it.
    idb.get().then((rec) => {
      const best = newest([current, rec])
      if (best && best !== current && best.at > (current?.at || 0)) {
        current = best
        store.set(KEY, best)
        render()
      } else if (current && (!rec || rec.at < current.at)) {
        idb.put(current)
      }
    })

    // A "#rank=..." link carries a ranking from another browser or device.
    function importFromLink() {
      const m = location.hash.match(/rank=([^&]+)/)
      if (!m) return
      history.replaceState(null, '', location.pathname + location.search)
      let order
      try { order = JSON.parse(decodeURIComponent(atob(m[1]))) } catch { return }
      if (!Array.isArray(order) || !confirm('Use the ranking from this link on this device?')) return
      current = { at: Date.now(), order }
      render()
      save()
    }
    importFromLink()
    window.addEventListener('hashchange', importFromLink)

    document.getElementById('share').addEventListener('click', async () => {
      const url = location.origin + location.pathname + '#rank=' + btoa(encodeURIComponent(JSON.stringify(cards().map((c) => c.dataset.id))))
      try {
        if (navigator.share) await navigator.share({ title: 'My Idea Lab ranking', url })
        else { await navigator.clipboard.writeText(url); alert('Link copied. Open it on your other device or browser to bring this ranking there.') }
      } catch {}
    })
  </script>
</body>
</html>
